options {
	directory "/var/cache/bind";
    managed-keys-directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    allow-query-cache { any; };
    dnssec-validation auto;
    # Cap the query cache (BIND 9.16+ default is unbounded — pod ran OOMKilled at 128Mi).
    max-cache-size 128m;
    # Trimmed 2026-10-30 (log-review #4): dropped 2606:4700:4700::64 (broken DNSSEC
    # signatures -> "insecurity proof failed" retries/noise) and 8.8.4.4 (extra
    # retransmit rounds during egress-loss bursts). All forwarders were timing out
    # in equal share -> egress path issue, not a single bad provider.
    forwarders {
        9.9.9.9;
        2620:fe::fe;
        8.8.8.8;
    };
};

zone "home.blrobinson.uk" IN {
    type primary;
    file "/etc/bind/db.home.blrobinson.uk";
};

zone "blrobinson.uk" IN {
    type primary;
    file "/etc/bind/db.blrobinson.uk";
};

zone "0.0.10.in-addr.arpa" {
    type primary;
    file "/etc/bind/db.rev.0.0.10.in-addr.arpa";
};

zone "2.0.10.in-addr.arpa" {
    type primary;
    file "/etc/bind/db.rev.2.0.10.in-addr.arpa";
};

zone "3.0.10.in-addr.arpa" {
    type primary;
    file "/etc/bind/db.rev.3.0.10.in-addr.arpa";
};

zone "e.a.7.2.2.c.1.6.6.0.a.2.ip6.arpa" {
    type master;
    file "/etc/bind/db.2a06_61c2_27ae.rev";
};

# Logging (log-review #14, re-fixed 2026-10-31; verified in a BIND 9.21 sandbox):
# - Explicitly assign every class we want. Do NOT add `category default`:
#   in this build it double-logs every class that is also explicitly assigned
#   (sandbox: 2x per event) and, on its own, logs queries 0x.
# - `category { a b c } { ch; }` list syntax is not valid named.conf grammar;
#   each class needs its own statement.
# - Sandbox matrix (3 identical queries): explicit list only -> exactly 1 line
#   per query and 1 line per startup event (zoneload/general/dnssec/notify).
logging {
    channel default_log {
        stderr;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category general      { default_log; };
    category config       { default_log; };
    category resolver     { default_log; };
    category security     { default_log; };
    category lame-servers { default_log; };
    category notify       { default_log; };
    category update       { default_log; };
    category client       { default_log; };
    category database     { default_log; };
    category xfer-in      { default_log; };
    category xfer-out     { default_log; };
    category dnssec       { default_log; };
    category zoneload     { default_log; };
    category queries      { default_log; };
};